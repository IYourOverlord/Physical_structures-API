modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
[[mods]]
modId = "${mod_id}"

version = "${mod_version}"

displayName = "${mod_name}"
authors = "${mod_authors}"


description = '''${mod_description}'''

[[dependencies."${mod_id}"]]

modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "cbc_autotarget"
type = "required"
versionRange = "[1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "sable"
type = "required"
versionRange = "[1,)"
ordering = "NONE"
side = "BOTH"

# Optional integration: if sable_schematic_api is installed, physical_structures
# can place its .nbt blueprints via the "sable" namespace (StructureSpawnerBlock /
# SpawnStructureItem) - see compat/sable/SableCompat.java. ordering=AFTER guarantees
# its /sablebp command is already registered by the time it might be needed.
[[dependencies."${mod_id}"]]
modId = "sable_schematic_api"
type = "optional"
versionRange = "[1,)"
ordering = "AFTER"
side = "BOTH"
